## adjudication-packet-service
## Builds SIGA correction packets and sends them to Registration Processor.

## ---- Authentication ----
# Keycloak client used by this service
mosip.iam.adapter.clientid=mosip-adjudication-client
# Client secret, set in the config server overrides
mosip.iam.adapter.clientsecret=${mosip.adjudication.client.secret}
# App ID, used to find the Keycloak realm
mosip.iam.adapter.appid=adjudication

## ---- Access to this service ----
# Accept only tokens issued to this client
auth.server.admin.allowed.audience=mosip-adjudication-client
# Base path of this service
mosip.service-context=${server.servlet.context-path}
# Endpoints that need no token
mosip.service.end-points=/actuator/health,/actuator/info
# HTTP method allowed without a token
mosip.service.exclude.auth.allowed.method=GET

## ---- Security ----
# Expose only the health and info actuator endpoints
management.endpoints.web.exposure.include=health,info
# Keep request bodies out of the logs
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN

## ---- Packet storage ----
# Store packets on the local disk
objectstore.adapter.name=PosixAdapter
# Temporary folder for packets
object.store.base.location=/tmp/adjudication-packets
# Folder where the service looks for the finished packet
mosip.adjudication.packet-store-base=${object.store.base.location}
# Account folder inside the packet store
mosip.adjudication.packet-store-account=${packet.manager.account.name}
# Identity mapping file, required by the packet manager
registration.processor.identityjson=identity-mapping.json

## ---- MOSIP URLs ----
# Gets the latest ID schema
mosip.adjudication.id-schema-url=${mosip.kernel.syncdata.url}/v1/syncdata/latestidschema
# Encrypts the sync request
mosip.adjudication.encrypt-url=${mosip.kernel.keymanager.url}/v1/keymanager/encrypt
# Syncs the packet with Registration Processor
mosip.adjudication.sync-url=${mosip.regproc.status.service.url}/registrationprocessor/v1/registrationstatus/syncV2
# Uploads the packet to Registration Processor
mosip.adjudication.packet-receiver-url=http://regproc-group1.regproc/registrationprocessor/v1/packetreceiver/registrationpackets
